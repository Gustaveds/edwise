<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edwise - Chat do Aluno</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        html,
        body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
        }

        #edwise-main {
            width: 100vw;
            height: 100vh;
            max-width: 100vw;
            max-height: 100vh;
            border-radius: 0;
            display: flex;
            flex-direction: column;
            background: linear-gradient(120deg, #e0e7ff 0%, #f5faff 100%);
            overflow: hidden;
        }

        /* Estilo para links nas mensagens */
        .edwise-msg a {
            color: #2563eb;
            /* Azul Tailwind 600 */
            text-decoration: underline;
            font-weight: 500;
            word-break: break-all;
            transition: color 0.2s;
        }

        .edwise-msg a:hover {
            color: #1d4ed8;
            /* Azul mais escuro */
        }

        @media (min-width: 600px) {
            #edwise-main {
                max-width: 410px;
                max-height: 90vh;
                margin: auto;
                border-radius: 24px;
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.10);
            }
        }
    </style>
</head>

<body class="p-0 m-0">
    <div id="edwise-main">
        <div class="bg-indigo-700 text-white py-4 px-5 flex flex-col">
            <span class="font-bold text-xl">Edwise</span>
            <span class="text-xs opacity-80">Dúvidas sobre aulas? Pergunte aqui!</span>
        </div>
        <div id="chat-body" class="flex-1 overflow-y-auto p-4 space-y-3 bg-indigo-50"></div>
        <form id="chat-form" class="flex p-3 bg-indigo-100 border-t border-indigo-200">
            <input type="text" id="chat-input" placeholder="Digite sua dúvida..." autocomplete="off"
                class="flex-1 rounded-lg px-3 py-2 border border-gray-300 focus:outline-indigo-400" />
            <button type="submit" id="send-btn"
                class="ml-2 bg-indigo-700 hover:bg-indigo-800 text-white px-5 py-2 rounded-lg font-medium transition">Enviar</button>
        </form>
    </div>
    <script>
        const chatBody = document.getElementById('chat-body');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');
        const webhookUrl = "https://webhooks.tgbia.com/webhook/chat123"; // troque pela URL do seu Webhook do n8n

        // Função para transformar URLs em links azuis clicáveis
        function parseLinks(text) {
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            return text.replace(urlRegex, url =>
                `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`
            );
        }

        function appendMessage(text, from = "user") {
            const msg = document.createElement('div');
            msg.className = "edwise-msg " + (from === "user"
                ? "text-right"
                : "text-left");
            msg.innerHTML = `<span class="inline-block rounded-xl px-3 py-2 ${from === "user"
                ? "bg-indigo-700 text-white"
                : "bg-white border border-indigo-200 text-gray-800"
                } max-w-[80%] break-words text-sm">${text}</span>`;
            chatBody.appendChild(msg);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        // Mensagem inicial
        appendMessage("👋 Olá! Sou a Edwise.<br>Pode perguntar sua dúvida sobre as aulas.", "bot");

        chatForm.onsubmit = async (e) => {
            e.preventDefault();
            const userText = chatInput.value.trim();
            if (!userText) return;
            appendMessage(userText, "user");
            chatInput.value = "";
            appendMessage("<span class='italic text-gray-400'>Digitando...</span>", "bot");
            try {
                const resp = await fetch(webhookUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: userText })
                });
                const data = await resp.json();
                chatBody.removeChild(chatBody.lastChild); // Remove o "Digitando..."
                // Aplica o parseLinks na resposta do bot
                appendMessage(parseLinks(data.reply || "Não entendi, tente novamente."), "bot");
            } catch {
                chatBody.removeChild(chatBody.lastChild);
                appendMessage("Erro ao conectar. Tente de novo mais tarde.", "bot");
            }
        };
    </script>
</body>

</html>
