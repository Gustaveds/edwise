version: '3.8'

services:
  # Backend Monolítico (com Whisper integrado)
  backend:
    build: ./server
    container_name: edwise-backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - MINIO_SERVER_URL=${MINIO_SERVER_URL:-https://s3.tgbia.com}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET:-edwise}
    depends_on:
      - db
      - minio
    volumes:
      - uploads:/app/uploads
    networks:
      - edwise-network

  # PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: edwise-db
    restart: always
    environment:
      - POSTGRES_DB=edwise
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - edwise-network
    ports:
      - "5432:5432"

  # MinIO (S3-compatible)
  minio:
    image: minio/minio:latest
    container_name: edwise-minio
    restart: always
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    volumes:
      - minio-data:/data
    networks:
      - edwise-network
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"

  # Frontend
  frontend:
    build: .
    container_name: edwise-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - edwise-network
    environment:
      - REACT_APP_API_URL=http://localhost:3001

volumes:
  uploads:
  postgres-data:
  minio-data:


networks:
  edwise-network:
    driver: bridge
