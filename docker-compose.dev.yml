services:
  db:
    image: pgvector/pgvector:pg15
    container_name: edwise-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-edwise}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # Bind mount (não volume nomeado do Docker): named volumes vivem dentro do
      # disco virtual interno do Docker Desktop, que já se mostrou instável em
      # resets/corrupção após reinícios do Windows/WSL. Um bind mount no próprio
      # drive do projeto sobrevive a isso, igual aos arquivos do repositório.
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_DATABASE:-edwise}"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: edwise-minio-dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      # Bind mount — ver comentário no serviço `db` sobre por que não usamos
      # um volume nomeado do Docker aqui.
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: edwise-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Cria o bucket automaticamente assim que o MinIO sobe.
  minio-init:
    image: minio/mc:latest
    container_name: edwise-minio-init-dev
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin} &&
        mc mb -p local/${MINIO_BUCKET:-edwise} || true &&
        mc anonymous set download local/${MINIO_BUCKET:-edwise} || true &&
        echo 'bucket ${MINIO_BUCKET:-edwise} pronto'
      "
    restart: "no"
